[project]
name = "phoenix-eval"
version = "0.0.1"
description = "Test and rebuild stripped Linux programs."
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
phoenix-eval = "phoenix_eval.__main__:main"

[build-system]
requires = ["uv_build==0.12.3"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "hypothesis",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
files = ["phoenix", "phoenix_eval", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

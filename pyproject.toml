[project]
name = "phoenix-reconstruction"
version = "0.0.1"
description = "Test and rebuild stripped Linux programs."
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "hypothesis",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
files = ["phoenix_eval", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

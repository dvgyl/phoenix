name: Public tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: Native ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-latest
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.12.3"
          enable-cache: false
      - run: uv sync --locked
      - run: ./scripts/check
      - run: ./scripts/build-worker "${{ matrix.architecture }}"
      - run: |
          uv run --locked phoenix-eval m0 \
            --mode "native-${{ matrix.architecture }}" \
            --runs "$RUNNER_TEMP/phoenix-runs"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: public-${{ matrix.architecture }}
          path: ${{ runner.temp }}/phoenix-runs/*/m0.json
          if-no-files-found: error

  compare:
    name: Compare native outcomes
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: public-*
          path: reports
      - run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          def outcomes(architecture):
              files = list(Path("reports", f"public-{architecture}").rglob("m0.json"))
              assert len(files) == 1, f"Expected one report for {architecture}."
              report = json.loads(files[0].read_text())
              assert report["behavior_checks_passed"]
              assert report["mode"] == f"native-{architecture}"
              return report["seed"], {
                  program["program"]: program["outcome_sha256"]
                  for program in report["programs"]
              }

          seed, amd64 = outcomes("amd64")
          arm_seed, arm64 = outcomes("arm64")
          assert amd64 and seed == arm_seed and amd64 == arm64, (
              "The native architectures produced different public outcomes."
          )
          PY

name: Public tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: Native ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-latest
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.12.3"
          enable-cache: false
      - run: uv sync --locked
      - run: ./scripts/check
      - run: ./scripts/build-worker "${{ matrix.architecture }}"
      - run: ./scripts/build-integrity "${{ matrix.architecture }}"
      - run: uv run --locked pytest -q tests/test_compiler_integrity.py
        env:
          PHOENIX_COMPILER_INTEGRITY_ARCHES: ${{ matrix.architecture }}
      - run: |
          uv run --locked phoenix-eval m0 \
            --mode "native-${{ matrix.architecture }}" \
            --runs "$RUNNER_TEMP/phoenix-runs"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: public-${{ matrix.architecture }}
          path: ${{ runner.temp }}/phoenix-runs/*/m0.json
          if-no-files-found: error

  compare:
    name: Compare native outcomes
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: public-*
          path: reports
      - run: python3 -m phoenix_eval.reports reports/public-amd64 reports/public-arm64
